# Bench target: ESP32 pump firmware on a real CAN bus.
# Setup notes: Career Claude/04_HIL_Project/runbooks/P-02.md
can:
  interface: gs_usb          # DSD TECH SH-C31x (CANable 2.0 design, candleLight firmware, USB 1d50:606f)
  channel: 0
  index: 0                   # first gs_usb adapter found
  bitrate: 500000            # must match the firmware (pump CAN spec: 500 kbit/s)
service_port:
  port: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0   # ESP32; fallback /dev/ttyUSB0
  baudrate: 115200
